<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>My ToDo List</title>
</head>
<body>
    <main>
        <h1>My ToDo List</h1>
        <button type="button" class="add-btn" id="add-btn">Add New Task</button>
        <div class="add-task-container hide" id="add-task-container">
            <label for="task-title">Title</label>
            <input name="title" class="task-title" id="task-title" required>
            <button type="submit" id="task-submit">Submit</button>
        </div>
       
        <div class="task-container" id="task-container">
            
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
